<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier une annonce - IFRI MentorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
        }
        .navbar { background-color: rgba(0,0,0,0.3) !important; }
        .card {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: #e94560;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-select option { background: #1a1a2e; color: white; }
        .btn-primary { background-color: #e94560; border: none; }
        .btn-primary:hover { background-color: #c73652; }
        .type-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .type-card:hover { border-color: #e94560; background: rgba(233,69,96,0.1); }
        .type-card input[type="radio"]:checked + label { color: #e94560; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎓 IFRI MentorLink</a>
            <div class="ms-auto">
                <a href="/tableau-de-bord" class="btn btn-outline-light btn-sm me-2">Tableau de bord</a>
                <a href="/deconnexion" class="btn btn-outline-light btn-sm">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 650px;">
        <div class="card">
            <h3 class="text-center mb-4">📢 Publier une annonce</h3>

            <form method="POST">
                <!-- Type d'annonce -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Type d'annonce</label>
                    <div class="row">
                        <div class="col-6">
                            <div class="type-card">
                                <input type="radio" name="type_annonce" value="offre" 
                                       id="offre" required style="display:none">
                                <label for="offre" style="cursor:pointer; width:100%">
                                    <div style="font-size:2rem">🎓</div>
                                    <div class="fw-bold">Offre de mentorat</div>
                                    <small class="opacity-75">Je veux aider quelqu'un</small>
                                </label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="type-card">
                                <input type="radio" name="type_annonce" value="demande" 
                                       id="demande" style="display:none">
                                <label for="demande" style="cursor:pointer; width:100%">
                                    <div style="font-size:2rem">🙋</div>
                                    <div class="fw-bold">Demande de mentorat</div>
                                    <small class="opacity-75">J'ai besoin d'aide</small>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Matière -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Matière concernée</label>
                    <select name="matiere_id" class="form-select" required>
                        <option value="">-- Choisir une matière --</option>
                        {% for matiere in matieres %}
                        <option value="{{ matiere.id }}">{{ matiere.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Format -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Format préféré</label>
                    <select name="format" class="form-select" required>
                        <option value="">-- Choisir un format --</option>
                        <option value="presentiel">Présentiel</option>
                        <option value="en_ligne">En ligne</option>
                        <option value="les_deux">Les deux</option>
                    </select>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Description</label>
                    <textarea name="description" class="form-control" rows="4" 
                              placeholder="Décris ce que tu cherches ou ce que tu proposes..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    Publier l'annonce
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Highlight selected type
        document.querySelectorAll('.type-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.type-card').forEach(c => {
                    c.style.borderColor = 'rgba(255,255,255,0.2)';
                    c.style.background = 'rgba(255,255,255,0.05)';
                });
                this.style.borderColor = '#e94560';
                this.style.background = 'rgba(233,69,96,0.1)';
                this.querySelector('input[type="radio"]').checked = true;
            });
        });
    </script>
</body>
</html>
