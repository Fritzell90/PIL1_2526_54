<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IFRI MentorLink{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar { background-color: rgba(0,0,0,0.3) !important; backdrop-filter: blur(10px); }
        .card {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: #e94560;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-select option { background: #1a1a2e; color: white; }
        .btn-primary { background-color: #e94560; border: none; border-radius: 30px; }
        .btn-primary:hover { background-color: #c73652; transform: translateY(-2px); }
        .btn-outline-light { border-radius: 30px; }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5" href="/">🎓 IFRI MentorLink</a>
            <div class="ms-auto d-flex gap-2">
                {% if session.utilisateur_id %}
                    <span class="navbar-text me-2 opacity-75">
                        👋 {{ session.utilisateur_nom }}
                    </span>
                    <a href="/profil" class="btn btn-outline-light btn-sm">Mon profil</a>
                    <a href="/tableau-de-bord" class="btn btn-outline-light btn-sm">Tableau de bord</a>
                    <a href="/deconnexion" class="btn btn-outline-light btn-sm">Déconnexion</a>
                {% else %}
                    <a href="/connexion" class="btn btn-outline-light btn-sm">Connexion</a>
                    <a href="/inscription" class="btn btn-primary btn-sm">S'inscrire</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div>
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_script %}{% endblock %}
</body>
</html>
