<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - IFRI MentorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }
        .form-control {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: #e94560;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .btn-primary { background-color: #e94560; border: none; width: 100%; }
        .btn-primary:hover { background-color: #c73652; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center mb-4">🎓 Connexion</h2>
        
        {% if erreur %}
        <div class="alert alert-danger">{{ erreur }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email ou téléphone</label>
                <input type="text" name="identifiant" class="form-control" 
                       placeholder="Email ou numéro de téléphone" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="mot_de_passe" class="form-control" 
                       placeholder="Votre mot de passe" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Se connecter</button>
        </form>

        <p class="text-center mt-3">
            Pas encore de compte ? 
            <a href="/inscription" style="color: #e94560;">S'inscrire</a>
        </p>
        <p class="text-center">
            <a href="/" style="color: rgba(255,255,255,0.6);">← Retour à l'accueil</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
