<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - IFRI MentorLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: white !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 15px 0;
        }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: #e94560 !important; }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 45px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .login-card h2 {
            font-weight: 800;
            color: #1a202c;
            font-size: 1.8rem;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .form-label { font-weight: 500; color: #4a5568; font-size: 0.9rem; }
        .btn-primary {
            background: #e94560;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px;
            font-size: 1rem;
            width: 100%;
        }
        .btn-primary:hover { background: #c73652; }
        .divider { color: #a0aec0; font-size: 0.85rem; }
        footer {
            background: white;
            border-top: 2px solid #fff5f7;
            padding: 20px 0;
            text-align: center;
            color: #718096;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">🎓 IFRI MentorLink</a>
            <div class="ms-auto">
                <a href="/inscription" class="btn btn-sm" style="background:#e94560; color:white; border-radius:8px; font-weight:500;">S'inscrire</a>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-4">
                <div style="font-size:2.5rem; margin-bottom:10px;">🎓</div>
                <h2>Bon retour !</h2>
                <p class="text-muted" style="font-size:0.9rem;">Connecte-toi à ton compte IFRI MentorLink</p>
            </div>

            {% if erreur %}
            <div class="alert alert-danger" style="border-radius:10px; font-size:0.9rem;">
                ⚠️ {{ erreur }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email ou téléphone</label>
                    <input type="text" name="identifiant" class="form-control"
                           placeholder="Ton email ou numéro de téléphone" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="mot_de_passe" class="form-control"
                           placeholder="Ton mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Se connecter →
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/reinitialiser-mot-de-passe" style="color:#e94560; font-size:0.88rem; text-decoration:none;">
                    🔑 Mot de passe oublié ?
                </a>
            </div>

            <hr style="margin: 20px 0; border-color:#f0f4f8;">

            <p class="text-center mb-0" style="font-size:0.9rem; color:#718096;">
                Pas encore de compte ?
                <a href="/inscription" style="color:#e94560; font-weight:600; text-decoration:none;">S'inscrire</a>
            </p>
        </div>
    </div>

    <footer>
        <p class="mb-0">🎓 <strong style="color:#e94560;">IFRI MentorLink</strong> — PIL1 2025-2026 • UAC/IFRI</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
