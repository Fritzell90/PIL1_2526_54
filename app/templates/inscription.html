<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - IFRI MentorLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar {
            background: white !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 15px 0;
        }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: #e94560 !important; }
        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 45px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .register-card h2 { font-weight: 800; color: #1a202c; font-size: 1.8rem; }
        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 0.95rem;
            color: #1a202c;
        }
        .form-control:focus, .form-select:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .form-label { font-weight: 500; color: #4a5568; font-size: 0.9rem; }
        .btn-primary {
            background: #e94560;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px;
            font-size: 1rem;
            width: 100%;
        }
        .btn-primary:hover { background: #c73652; }
        footer {
            background: white;
            border-top: 2px solid #fff5f7;
            padding: 20px 0;
            text-align: center;
            color: #718096;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">🎓 IFRI MentorLink</a>
            <div class="ms-auto">
                <a href="/connexion" class="btn btn-sm" style="border:2px solid #e94560; color:#e94560; border-radius:8px; font-weight:500;">Connexion</a>
            </div>
        </div>
    </nav>

    <div class="register-wrapper">
        <div class="register-card">
            <div class="text-center mb-4">
                <div style="font-size:2.5rem; margin-bottom:10px;">🎓</div>
                <h2>Créer un compte</h2>
                <p class="text-muted" style="font-size:0.9rem;">Rejoins la communauté IFRI MentorLink</p>
            </div>

            {% if erreur %}
            <div class="alert alert-danger" style="border-radius:10px; font-size:0.9rem;">
                ⚠️ {{ erreur }}
            </div>
            {% endif %}

            <form method="POST">
                {% if erreur %}
                <div class="alert alert-danger" style="border-radius:10px;">⚠️ {{ erreur }}</div>
                {% endif %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" placeholder="Ton nom" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" placeholder="Ton prénom" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Adresse email</label>
                    <input type="email" name="email" class="form-control" placeholder="ton@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Numéro de téléphone</label>
                    <input type="tel" name="telephone" class="form-control" placeholder="ex: 97000000" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Filière</label>
                        <select name="filiere_id" class="form-select">
                            <option value="">-- Choisir --</option>
                            {% for filiere in filieres %}
                            <option value="{{ filiere.id }}">{{ filiere.code }} - {{ filiere.libelle }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Niveau d'études</label>
                        <select name="niveau_etudes" class="form-select">
                            <option value="">-- Choisir --</option>
                            <option value="L1">L1</option>
                            <option value="L2">L2</option>
                            <option value="L3">L3</option>
                            <option value="M1">M1</option>
                            <option value="M2">M2</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="mot_de_passe" id="mot_de_passe" class="form-control"
                           placeholder="Choisissez un mot de passe" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" name="confirmation" id="confirmation" class="form-control"
                           placeholder="Confirmez votre mot de passe" required>
                    <div id="message_confirmation" class="mt-1" style="font-size:0.85rem;"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Créer mon compte →
                </button>
            </form>

            <hr style="margin: 20px 0; border-color:#f0f4f8;">

            <p class="text-center mb-0" style="font-size:0.9rem; color:#718096;">
                Déjà un compte ?
                <a href="/connexion" style="color:#e94560; font-weight:600; text-decoration:none;">Se connecter</a>
            </p>
        </div>
    </div>

    <footer>
        <p class="mb-0">🎓 <strong style="color:#e94560;">IFRI MentorLink</strong> — PIL1 2025-2026 • UAC/IFRI</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('confirmation').addEventListener('input', function() {
            const mdp = document.getElementById('mot_de_passe').value;
            const confirm = this.value;
            const msg = document.getElementById('message_confirmation');
            if (confirm === '') {
                msg.innerHTML = '';
            } else if (mdp === confirm) {
                msg.innerHTML = '✅ Les mots de passe correspondent !';
                msg.style.color = '#38a169';
            } else {
                msg.innerHTML = '❌ Les mots de passe ne correspondent pas !';
                msg.style.color = '#e94560';
            }
        });
    </script>
</body>
</html>
