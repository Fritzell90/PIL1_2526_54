<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - IFRI MentorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 40px 0;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            backdrop-filter: blur(10px);
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: #e94560;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-select option { background: #1a1a2e; color: white; }
        .btn-primary { background-color: #e94560; border: none; width: 100%; }
        .btn-primary:hover { background-color: #c73652; }
        .form-label { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center mb-4">🎓 Inscription</h2>

        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" name="nom" class="form-control" 
                           placeholder="Votre nom" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Prénom</label>
                    <input type="text" name="prenom" class="form-control" 
                           placeholder="Votre prénom" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Adresse email</label>
                <input type="email" name="email" class="form-control" 
                       placeholder="votre@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Numéro de téléphone</label>
                <input type="tel" name="telephone" class="form-control" 
                       placeholder="ex: 97000000" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Filière</label>
                    <select name="filiere_id" class="form-select">
                        <option value="">-- Choisir --</option>
                        {% for filiere in filieres %}
                        <option value="{{ filiere.id }}">{{ filiere.code }} - {{ filiere.libelle }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Niveau d'études</label>
                    <select name="niveau_etudes" class="form-select">
                        <option value="">-- Choisir --</option>
                        <option value="L1">L1</option>
                        <option value="L2">L2</option>
                        <option value="L3">L3</option>
                        <option value="M1">M1</option>
                        <option value="M2">M2</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="mot_de_passe" class="form-control" 
                       placeholder="Choisissez un mot de passe" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Créer mon compte</button>
        </form>

        <p class="text-center mt-3">
            Déjà un compte ? 
            <a href="/connexion" style="color: #e94560;">Se connecter</a>
        </p>
        <p class="text-center">
            <a href="/" style="color: rgba(255,255,255,0.6);">← Retour à l'accueil</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
